# ===============================
# Application
# ===============================
spring.application.name=backend
server.port=8081

# ===============================
# Datasource
# ===============================
spring.datasource.url=jdbc:postgresql://oxtore-db:5432/oxtore-db
spring.datasource.username=oxtore
spring.datasource.password=oxtore
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# Connection Pool (Hikari)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.context=DEBUG

# ===============================
# Security
# ===============================
jwt.secret= ${JWT_SECRET}
# Access token lifetime (ms), default 24 h
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
# Refresh tokens: separate key (>= 64 bytes, different from JWT_SECRET), default lifetime 7 days
jwt.refresh-secret=${JWT_REFRESH_SECRET:}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Google Sign-In: OAuth 2.0 Web client ID; empty = POST /api/auth/google answers 503 GOOGLE_UNAVAILABLE
google.client-id=${GOOGLE_CLIENT_ID:}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Realtime notifications (Socket.IO v4, separate Netty server)
socketio.host=0.0.0.0
socketio.port=8082

# Image uploads (stored as files; the DB keeps storage keys, responses build URLs from app.public-base-url)
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
app.upload.max-file-size=5MB
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8081}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Let Tomcat read (and discard) oversized bodies so the client gets a readable 413 instead of a reset connection
server.tomcat.max-swallow-size=20MB

# Behind a proxy (Railway), take the client IP from X-Forwarded-For (trusted from internal proxy ranges only),
# otherwise every user shares the proxy IP and the per-IP OTP limit.
server.forward-headers-strategy=native

# ===============================
# Sign-up verification codes (OTP) - see README "Auth & OTP configuration"
# ===============================
otp.ttl=10m
otp.max-attempts=5
otp.resend-cooldown=60s
otp.max-sends-per-email-per-hour=5
otp.max-sends-per-ip-per-hour=20
# Required: random, at least 32 characters. Codes are stored as HMAC-SHA256 with this key.
otp.hmac-secret=${OTP_HMAC_SECRET:}

# Email delivery (SMTP). Leave MAIL_HOST empty to disable the email channel.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:Oxtore}

# WhatsApp delivery: "twilio" or "none"
whatsapp.provider=${WHATSAPP_PROVIDER:none}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone=${TWILIO_PHONE:}
twilio.whatsapp-content-sid=${TWILIO_WHATSAPP_CONTENT_SID:}
