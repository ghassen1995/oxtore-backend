# Local development profile (SPRING_PROFILES_ACTIVE=dev). Never enable it in production.

# Writes OTP codes to the log for channels without a configured provider. Off unless OTP_DEV_LOG_CODES=true.
otp.dev.log-codes=${OTP_DEV_LOG_CODES:false}

# Placeholder so the app starts locally without configuration. NOT a secret: real environments must set OTP_HMAC_SECRET.
otp.hmac-secret=${OTP_HMAC_SECRET:dev-only-otp-hmac-key-not-for-production-use}
jwt.refresh-secret=${JWT_REFRESH_SECRET:dev-only-refresh-token-signing-key-not-for-production-use-0123456789abcdef}
