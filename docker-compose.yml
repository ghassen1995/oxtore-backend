services:

  backend:
    container_name: oxtore_backend
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8082:8082" # Socket.IO notifications
    volumes:
      - oxtore-uploads:/app/uploads # uploaded images survive container rebuilds
    environment:
      APP_UPLOAD_DIR: /app/uploads
      # Base of image URLs sent to the app. Use the PC's LAN address (e.g. http://192.168.1.13:8081) when testing on a phone.
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8081}
      # Secrets and provider settings come from ./.env (not committed); see .env.example and README.md
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?set OTP_HMAC_SECRET in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      OTP_DEV_LOG_CODES: ${OTP_DEV_LOG_CODES:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Oxtore}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-none}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE: ${TWILIO_PHONE:-}
      TWILIO_WHATSAPP_CONTENT_SID: ${TWILIO_WHATSAPP_CONTENT_SID:-}
    depends_on:
      oxtore-db:
        condition: service_healthy
    networks:
      - backend

  oxtore-db:
    image: postgres:16
    container_name: oxtore-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: oxtore
      POSTGRES_PASSWORD: oxtore
      POSTGRES_DB: oxtore-db
    volumes:
      - oxtore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxtore -d oxtore-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  oxtore-db-data:
  oxtore-uploads:
