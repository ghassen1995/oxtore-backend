# Nginx site for the Oxtore backend (see DEPLOY.md).
# Replace api.example.com with your domain. certbot --nginx later adds the HTTPS server block and the HTTP redirect.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Above Spring's 6MB multipart limit, so oversized uploads get the app's readable 413
    client_max_body_size 20m;

    # Socket.IO notifications (separate Netty server on 8082), WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # REST API and uploaded images
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
